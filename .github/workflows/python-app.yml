name: Python application

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install system dependencies
      run: |
        sudo apt-get update -q
        sudo apt-get install -y libsndfile1 pulseaudio

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: |
        # Fail on syntax errors or undefined names (equivalent to the old
        # flake8 E9,F63,F7,F82 gate)
        ruff check . --select=F63,F7,F82 \
          --exclude=src/controller/frontend,dev
        # Warnings only for the full configured rule set (see [tool.ruff]
        # in pyproject.toml for line-length/rule selection)
        ruff check . --exit-zero \
          --exclude=src/controller/frontend,dev

    - name: Test with pytest
      run: |
        pytest --cov=src --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        fail_ci_if_error: true