openapi: 3.1.0
info:
  title: SAVIOUR Controller REST API
  version: "1.2.0"
  description: >
    Resource-oriented HTTP API on the SAVIOUR controller for external
    programs on the lab LAN (pyControl, MATLAB, bespoke acquisition
    scripts) to read system state and drive the recording lifecycle
    without speaking Socket.IO. Plain HTTP; the LAN is the trust
    boundary (see CLAUDE.md). Prose reference: docs/REST_API.md.
servers:
  - url: http://{controller}:5000
    variables:
      controller:
        default: 192.168.0.98

security:
  - bearerAuth: []

tags:
  - name: meta
  - name: state
  - name: modules
  - name: sessions
  - name: markers
  - name: events
  - name: tokens

paths:
  /api/v1/:
    get:
      tags: [meta]
      summary: API index (unauthenticated)
      security: []
      responses:
        "200": { description: OK }

  /api/v1/openapi.json:
    get:
      tags: [meta]
      summary: This spec, as JSON (unauthenticated)
      security: []
      responses:
        "200": { description: OpenAPI document }

  /api/v1/state:
    get:
      tags: [state]
      summary: System rollup
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/State" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/readiness:
    get:
      tags: [state]
      summary: Can a session start on this target right now?
      parameters:
        - name: target
          in: query
          schema: { type: string, default: all }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/health:
    get:
      tags: [state]
      summary: Fleet health summary + per-module health
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/ptp:
    get:
      tags: [state]
      summary: Per-module PTP offsets + the start-gate verdict
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/exports:
    get:
      tags: [state]
      summary: Exported recordings + pending/failed export counts
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/events:
    get:
      tags: [events]
      summary: Server-Sent Events stream (sessions / modules / alert / marker)
      parameters:
        - name: types
          in: query
          description: Comma-separated event-type allowlist
          schema: { type: string }
      responses:
        "200":
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/modules:
    get:
      tags: [modules]
      summary: Module registry
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/modules/{module_id}:
    get:
      tags: [modules]
      summary: One module
      parameters: [{ $ref: "#/components/parameters/ModuleId" }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/modules/{module_id}/health:
    get:
      tags: [modules]
      summary: One module's health
      parameters: [{ $ref: "#/components/parameters/ModuleId" }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/modules/{module_id}/config:
    get:
      tags: [modules]
      summary: Read a module's config (shape + sync state)
      description: >
        The module's last controller-confirmed config, the controller's
        intended target_config, and the sync verdict. `_`-prefixed internal
        keys are hidden unless include_private=true.
      parameters:
        - $ref: "#/components/parameters/ModuleId"
        - name: include_private
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModuleConfig" }
        "404": { $ref: "#/components/responses/NotFound" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    patch:
      tags: [modules]
      summary: Partial config update (one or many keys)
      description: >
        Deep-merges the body onto the module's current config and pushes the
        result. Nested objects merge; scalars and lists replace. `_`-prefixed
        keys are dropped. Rejected 409 while the module is recording, or 409
        if the module has not yet reported a config to merge onto. The apply
        is a module round-trip, so the default response is 202 with
        config_sync_status "PENDING" -- poll GET .../config until SYNCED, or
        pass wait=<secs> (<=30) to block for the ack and get 200 on SYNCED.
      parameters:
        - $ref: "#/components/parameters/ModuleId"
        - name: wait
          in: query
          description: Seconds to block server-side for the set_config ack (max 30)
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              example: { camera: { fps: 90, sensor_mode_index: 1 } }
      responses:
        "200":
          description: Applied and confirmed (SYNCED); only when wait= was passed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPatchResult" }
        "202":
          description: Accepted, awaiting the module ack (PENDING)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConfigPatchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/system/update:
    get:
      tags: [system]
      summary: Whether the controller can git pull
      description: >
        {available, branch, remote} when /usr/local/src/saviour is a git
        checkout on a named branch with an origin remote; {available:false,
        reason} otherwise. Precondition for the POST.
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [system]
      summary: git pull + rebuild + restart the controller (and optionally the fleet)
      description: >
        git fetch --prune origin <current branch> -> git reset --hard
        origin/<branch> -> stage the module package -> optionally rebuild+restart
        the controller and/or tell every module to pull. Only ever pulls the
        checkout's own configured origin/branch. Requires the admin password
        (not a scoped token). The controller is snapshotted first. 202 when
        apply_controller (a restart drops the connection); 200 otherwise.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apply_controller: { type: boolean, default: true }
                deploy_modules: { type: boolean, default: false }
      responses:
        "200":
          description: Staged (and modules notified); no controller restart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemUpdateResult" }
        "202":
          description: Applied; controller restart imminent, connection drops
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemUpdateResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: No usable git checkout on this device
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: git fetch/reset failed (message carries git stderr)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: All recording sessions
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [sessions]
      summary: Create (and optionally start) a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSession" }
      responses:
        "201":
          description: Session created (carries autostart_error if the start gate rejected it)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ShareUnavailable" }

  /api/v1/sessions/{session_name}:
    get:
      tags: [sessions]
      summary: One session
      parameters: [{ $ref: "#/components/parameters/SessionName" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [sessions]
      summary: Delete a stopped/errored session
      parameters:
        - { $ref: "#/components/parameters/SessionName" }
        - name: files
          in: query
          schema: { type: boolean, default: true }
        - name: force
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/sessions/{session_name}/stop:
    post:
      tags: [sessions]
      summary: Stop a session
      parameters: [{ $ref: "#/components/parameters/SessionName" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "404": { $ref: "#/components/responses/NotFound" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/sessions/{session_name}/pause:
    post:
      tags: [sessions]
      summary: Pause a Habitat Session
      parameters: [{ $ref: "#/components/parameters/SessionName" }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/sessions/{session_name}/resume:
    post:
      tags: [sessions]
      summary: Resume a paused Habitat Session
      parameters: [{ $ref: "#/components/parameters/SessionName" }]
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/sessions/{session_name}/marker:
    post:
      tags: [markers]
      summary: Append an event marker to the running session
      parameters: [{ $ref: "#/components/parameters/SessionName" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkerCreate" }
      responses:
        "201":
          description: Recorded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkerAck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/sessions/{session_name}/markers:
    get:
      tags: [markers]
      summary: Read back the session's markers.csv
      parameters:
        - { $ref: "#/components/parameters/SessionName" }
        - name: since
          in: query
          description: Epoch seconds; keep markers at/after this time
          schema: { type: number }
        - name: limit
          in: query
          description: Keep only the most recent N
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  markers:
                    type: array
                    items: { $ref: "#/components/schemas/Marker" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/tokens:
    get:
      tags: [tokens]
      summary: List API tokens (metadata only) -- admin password required
      responses:
        "200": { description: OK }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [tokens]
      summary: Mint an API token -- admin password required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                readonly: { type: boolean, default: false }
      responses:
        "201":
          description: Created (token shown once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  token: { type: string }
                  created: { type: string, format: date-time }
                  readonly: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/tokens/{name}:
    delete:
      tags: [tokens]
      summary: Revoke an API token -- admin password required
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        The shared admin password or a named API token. Token-management
        routes require the admin password specifically.

  parameters:
    ModuleId:
      name: module_id
      in: path
      required: true
      schema: { type: string }
    SessionName:
      name: session_name
      in: path
      required: true
      schema: { type: string }

  responses:
    Unauthorized:
      description: Missing/invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Read-only API token used on a non-GET route
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Unknown module or session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid request body or query
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: State does not allow the action (module recording, PTP not synced, ...)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ShareUnavailable:
      description: Export share is configured but unreachable/full
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
          required: [code, message]
      required: [error]

    State:
      type: object
      properties:
        version: { type: string }
        uptime_s: { type: number }
        recording: { type: boolean }
        sessions:
          type: object
          additionalProperties: { type: integer }
        modules:
          type: object
          properties:
            total: { type: integer }
            online: { type: integer }
            offline: { type: integer }
        ptp:
          type: object
          properties:
            worst_offset_ns: { type: [integer, "null"] }
            start_gate_ns: { type: integer }
            synced: { type: boolean }
        disk: { type: object }

    Readiness:
      type: object
      properties:
        target: { type: string }
        ready: { type: boolean }
        checks:
          type: object
          additionalProperties:
            type: object
            properties:
              ok: { type: boolean }
              detail: { type: [string, "null"] }

    ModuleConfig:
      type: object
      properties:
        module_id: { type: string }
        config_sync_status:
          type: string
          enum: [SYNCED, PENDING, FAILED, UNKNOWN]
        config_diffs:
          type: array
          items: { type: string }
        config:
          type: object
          description: Last controller-confirmed config; the shape a PATCH body slots into
          additionalProperties: true
        target_config:
          type: object
          additionalProperties: true

    SystemUpdateResult:
      type: object
      properties:
        branch: { type: string }
        old_commit: { type: string }
        new_commit: { type: string }
        modules_notified: { type: integer }
        applying: { type: boolean }

    ConfigPatchResult:
      type: object
      properties:
        module_id: { type: string }
        config_sync_status:
          type: string
          enum: [SYNCED, PENDING, FAILED, UNKNOWN]
        config_diffs:
          type: array
          items: { type: string }
        applied:
          type: object
          description: The private-key-filtered patch as received
          additionalProperties: true
        target_config:
          type: object
          description: Full merged config dispatched to the module
          additionalProperties: true

    CreateSession:
      type: object
      required: [name]
      properties:
        name: { type: string }
        target: { type: string, default: all }
        duration_minutes: { type: [number, "null"] }
        researcher: { type: [string, "null"] }
        unattended: { type: boolean, default: false }
        autostart: { type: boolean, default: false }

    Session:
      type: object
      description: Serialised RecordingSession dataclass
      properties:
        session_name: { type: string }
        target: { type: string }
        state:
          type: string
          enum: [pending, scheduled, active, paused, stopped, error]
        modules:
          type: array
          items: { type: string }
        start_time: { type: [string, "null"] }
        end_time: { type: [string, "null"] }
        duration_minutes: { type: [number, "null"] }
        pending_exports: { type: integer }
        total_exports_failed: { type: integer }
        autostart_error: { type: string }
      additionalProperties: true

    MarkerCreate:
      type: object
      required: [label]
      properties:
        label: { type: string }
        source: { type: string }
        t:
          type: number
          description: Caller's epoch time for the event, in seconds

    MarkerAck:
      type: object
      properties:
        success: { type: boolean }
        session_name: { type: string }
        recv_wall_ns: { type: integer }
        recv_iso: { type: string }
        label: { type: string }

    Marker:
      type: object
      properties:
        recv_wall_ns: { type: integer }
        recv_iso: { type: string }
        label: { type: string }
        source: { type: string }
        client_wall_ns: { type: [integer, "null"] }
