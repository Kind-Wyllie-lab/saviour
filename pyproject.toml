[build-system]
requires = ["hatchling", "setuptools>=80", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "saviour"
dynamic = ["version"]
description = "Modular Synchronised Data Capture System for behavioral testing labs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Andrew Scott-George", email = "ascottg@ed.ac.uk" },
    { name = "Paul Rignanese", email = "prignane@ed.ac.uk" },
    { name = "Domagoj Anticic", email = "d.anticic@sms.ed.ac.uk" },
    { name = "Patrick Spooner", email = "p.a.spooner@ed.ac.uk" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=2.2.4",
    "psutil>=7.0.0",
    "pytest>=8.4.2",
    "python-dotenv>=1.1.0",
    "pyzmq>=26.4.0",
    "zeroconf>=0.146.3",
    "Flask>=2.2.6",
    "Flask-SocketIO>=5.5.1",
    "Werkzeug>=2.2.6",
    "opencv-python>=4.0.0",
    "SoundCard>=0.4.4",
    "soundfile>=0.13.1",
    "glfw>=2.5.0",
    "PyOpenGL>=3.1.0",
    "Pillow>=10.0.0",
    "pyserial>=3.5",
    "gpiozero>=2.0",
    # /api/v1/openapi.json renders docs/openapi.yaml (rest_api.py)
    "PyYAML>=6.0"
]

[tool.hatch.build]
exclude = [
    "src/controller/frontend/node_modules",
    "src/controller/frontend/.next",
    "src/controller/frontend/dist",
    "src/controller/frontend/build",
]

[tool.hatch.version]
path = "src/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-mock>=3.14.0",
    "ruff>=0.16,<0.17",  # CI gates on ruff; a new minor can add rules
    "pytest-cov>=7.0",
    # tools/analyse_audio_sync.py (analysis tool, not a module runtime dep)
    "scipy>=1.11",
]

[tool.setuptools_scm]


[tool.pytest.ini_options]
testpaths = ["src/controller/tests", "src/modules/tests", "src/tests"]
python_files = ["test_*.py"]
addopts = "-v -p no:cacheprovider"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["src/controller/frontend", "dev", "env", "env2", "*.ipynb",
                  "tools/ephys"]  # vendored

[tool.ruff.lint]
# CI gates on this whole set (python-app.yml). Correctness rules are on;
# the ignores are style-only classes not worth a tree-wide churn diff.
select = ["E", "F", "W", "B", "UP", "I", "N", "RUF", "PLE", "PLW"]
ignore = [
    "E501",     # line length: the formatter's job, not a gate
    "E402",     # imports after sys.path setup in variant entry points
    "E701", "E702",  # one-line compound statements
    "E712", "E711",  # == True/None: deliberate for numpy/pandas operands
    "E741",     # short names like `l`
    "N806",     # UPPER_CASE constants scoped inside a function
    "B905",     # zip() without strict=
    "PLW0108",  # lambda wrappers
    "PLW0603",  # module-level singletons via `global`
    "PLW1510",  # subprocess.run without check=: failure handled via returncode
    "PLW2901",  # rebinding a loop variable
    "RUF001", "RUF002", "RUF003",  # dashes, µ, × in text
    "RUF005",   # list concatenation vs unpacking
    "RUF012",   # mutable class attributes without ClassVar
    "RUF013",   # implicit Optional in annotations
    "RUF046",   # int() around an int
    "RUF059",   # unused names in tuple unpacking
    "RUF100",   # noqa codes for rules not enabled document intent
]

[tool.ruff.lint.per-file-ignores]
# _dest_reached closes over the loop variables but is called in the same iteration.
"src/modules/variants/loom_camera/loom_stimulus.py" = ["B023"]

[tool.ruff.lint.isort]
known-first-party = ["saviour"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.coverage.run]
omit = ["*/tests/*"]

[project.urls]
Homepage = "https://github.com/Kind-Wyllie-lab/saviour"
Documentation = "https://github.com/Kind-Wyllie-lab/saviour#readme"
Repository = "https://github.com/Kind-Wyllie-lab/saviour.git"
Issues = "https://github.com/Kind-Wyllie-lab/saviour/issues" 
