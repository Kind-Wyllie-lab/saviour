NAME="Basler Camera"
DESCRIPTION="Basler GigE / USB3 industrial camera (pypylon)"

# pypylon is not in apt — its wheels bundle the Pylon runtime and are installed
# into the module venv by POST_INSTALL below. `ethtool` is handy for bumping the
# NIC MTU to 9000 (jumbo frames) on a GigE deployment.
APT_PACKAGES="ethtool"
POST_INSTALL="install_pypylon.sh"
